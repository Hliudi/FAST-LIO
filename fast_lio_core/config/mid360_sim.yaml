common:
    lid_topic:  "/livox/lidar_front"
    imu_topic:  "/imu"
    time_sync_en: false
    time_offset_lidar_to_imu: 0.0
preprocess:
    lidar_type: 1                # Livox path (wrapper feeds CustomMsg)
    scan_line: 16
    blind: 0.3
mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    360
    det_range:     50.0
    extrinsic_est_en:  false
    extrinsic_T: [ 0.0, 0.0, 0.0 ]    # sim: lidar & IMU co-located on lidar_link
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1]
publish:
    path_en:  false
    scan_publish_en:  true
    dense_publish_en: true
    scan_bodyframe_pub_en: true
pcd_save:
    pcd_save_en: false
    interval: -1
